name: Portal Status QA

on:
  pull_request:
    paths:
      - "status.js"
      - "server-status.json"
      - "audit/portal-status-qa.js"
      - ".github/workflows/foundry-status-monitor.yml"
      - ".github/workflows/portal-status-qa.yml"
  push:
    branches:
      - main
    paths:
      - "status.js"
      - "server-status.json"
      - "audit/portal-status-qa.js"
      - ".github/workflows/foundry-status-monitor.yml"
      - ".github/workflows/portal-status-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-status-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check status script syntax
        run: node --check status.js

      - name: Check portal status QA syntax
        run: node --check audit/portal-status-qa.js

      - name: Run portal status QA
        run: node audit/portal-status-qa.js
