name: Browser Mobile QA

on:
  pull_request:
    paths:
      - "index.html"
      - "creator-personarum.html"
      - "creator-personarum.css"
      - "creator-personarum.js"
      - "creator-personarum-catalog.js"
      - "creator-personarum-final-frame.png"
      - "creador *.mp4"
      - "audit/creator-personarum-qa.js"
      - "audit/creator-personarum-browser-qa.mjs"
      - "*.css"
      - "mobile-*.js"
      - "character-*.js"
      - "characters.js"
      - "status.js"
      - "server-status.json"
      - "foundry_characters_static/**"
      - "audit/browser-mobile-qa-runner.mjs"
      - ".github/workflows/browser-mobile-qa.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "creator-personarum.html"
      - "creator-personarum.css"
      - "creator-personarum.js"
      - "creator-personarum-catalog.js"
      - "audit/creator-personarum-browser-qa.mjs"
      - "creator-personarum-final-frame.png"
      - "creador *.mp4"
      - "audit/creator-personarum-qa.js"
      - "*.css"
      - "mobile-*.js"
      - "character-*.js"
      - "characters.js"
      - "status.js"
      - "server-status.json"
      - "foundry_characters_static/**"
      - "audit/browser-mobile-qa-runner.mjs"
      - ".github/workflows/browser-mobile-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save playwright@1.54.1

      - name: Install Chromium and WebKit (clean retry on failure)
        shell: bash
        run: |
          set -euo pipefail
          install_browsers() {
            timeout --signal=TERM --kill-after=30s 8m npx playwright install --with-deps chromium webkit
          }
          if install_browsers; then
            exit 0
          fi
          echo "Browser installation failed or timed out. Removing the Playwright browser cache and retrying once."
          rm -rf "$HOME/.cache/ms-playwright"
          install_browsers

      - name: Check QA script syntax
        run: node --check audit/browser-mobile-qa-runner.mjs

      - name: Check Creator Personarum flow and assets
        run: |
          node --check creator-personarum.js
          node --check creator-personarum-catalog.js
          node audit/creator-personarum-qa.js
          node --check audit/creator-personarum-browser-qa.mjs

      - name: Browser smoke tests for Creator Personarum
        run: node audit/creator-personarum-browser-qa.mjs

      - name: Run browser QA
        run: node audit/browser-mobile-qa-runner.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mobile-qa-${{ github.sha }}
          path: audit/browser-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
