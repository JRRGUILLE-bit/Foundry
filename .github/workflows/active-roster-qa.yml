name: Active Roster QA

on:
  pull_request:
    paths:
      - "data/characters/index.json"
      - "foundry_characters_static/characters.index.json"
      - "party-roster.js"
      - "character-static-runtime.js"
      - "audit/active-roster-qa.js"
      - ".github/workflows/active-roster-qa.yml"
  push:
    branches:
      - main
    paths:
      - "data/characters/index.json"
      - "foundry_characters_static/characters.index.json"
      - "party-roster.js"
      - "character-static-runtime.js"
      - "audit/active-roster-qa.js"
      - ".github/workflows/active-roster-qa.yml"

permissions:
  contents: read

jobs:
  active-roster-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate active roster
        run: node audit/active-roster-qa.js
